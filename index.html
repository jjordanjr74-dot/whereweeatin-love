<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Where We Eatin'? — redirecting</title>
<link rel="canonical" href="https://whereeatin.com/">
<meta name="robots" content="noindex">
<!-- This hostname is an alternate spelling of whereeatin.com. It exists only to catch mistyped or
     misremembered addresses and send them to the real site, so there is never a broken "brand" visit. -->
<meta http-equiv="refresh" content="0; url=https://whereeatin.com/">
<script>location.replace("https://whereeatin.com/" + location.pathname + location.search + location.hash);</script>
</head>
<body style="font-family:system-ui,sans-serif;background:#111;color:#eee;display:grid;place-items:center;height:100vh;margin:0">
  <main style="text-align:center;padding:2rem">
    <h1 style="font-size:1.4rem;margin:0 0 .6rem">Where We Eatin'?</h1>
    <p style="margin:0 0 1rem;opacity:.8">Taking you to the real site&hellip;</p>
    <p style="margin:0"><a href="https://whereeatin.com/" style="color:#7dd3fc">Continue to whereeatin.com &rarr;</a></p>
  </main>
</body>
</html>
